
<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>আয়বন্ধু</title>
<style>
body{font-family:Arial;background:#effaf3;color:#174b36;text-align:center;padding:20px}
main{background:white;padding:20px;border-radius:12px;max-width:350px;margin:auto}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0}
button{background:#087f5b;color:white;border:0}
</style>
</head>
<body>
<h1>🌿 আয়বন্ধু</h1>
<p>আয়ের সাথে বন্ধুত্ব</p>
<main>
<h3>অ্যাকাউন্ট</h3>
<input id="email" type="email" placeholder="আপনার ইমেইল">
<input id="pass" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)">
<button onclick="go('signup')">রেজিস্ট্রেশন</button>
<button onclick="go('login')">লগইন</button>
<button onclick="go('logout')">লগআউট</button>
<p id="msg">স্বাগতম!</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient(
'https://qnhhziffunvghjwqxkxw.supabase.co',
'sb_publishable_vJ5oklSSFJMs4ePqVz_ZLQ_TKfYIpKL'
);
async function go(a){
let m=document.getElementById('msg');
m.textContent='অপেক্ষা করুন...';
try{
let r;
if(a==='signup')r=await db.auth.signUp({email:email.value.trim(),password:pass.value});
else if(a==='login')r=await db.auth.signInWithPassword({email:email.value.trim(),password:pass.value});
else r=await db.auth.signOut();
if(r.error)throw r.error;
m.textContent=a==='signup'?'রেজিস্ট্রেশন অনুরোধ সফল। ইমেইল যাচাই করুন।':a==='login'?'লগইন সফল!':'লগআউট হয়েছে।';
}catch(e){m.textContent='সমস্যা: '+e.message}
}
</script>
</body>
</html>
