
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>আয়বন্ধু</title>
  <style>
    body {
      font-family: sans-serif;
      background: #effaf3;
      text-align: center;
      padding: 35px 16px;
      color: #164734;
    }
    .card {
      background: white;
      max-width: 380px;
      margin: 25px auto;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 18px #0001;
    }
    h1 { color: #087f5b; }
    a {
      display: inline-block;
      background: #087f5b;
      color: white;
      padding: 12px 20px;
      border-radius: 9px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>আয়বন্ধু</h1>
    <p>আপনার অ্যাকাউন্টে স্বাগতম!</p>
    <p>আমাদের ওয়েবসাইট তৈরির কাজ চলছে।</p>
    <a href="mailto:support@example.com">যোগাযোগ</a>
  </div>
</body>
</html>
